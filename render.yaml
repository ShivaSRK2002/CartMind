services:
  - type: web
    name: velora-api
    runtime: docker
    plan: free
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      # Must be IDENTICAL to the JWT_SECRET set on the Vercel projects
      # (Velora + Orbit) so they can verify the session cookie.
      - key: JWT_SECRET
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: velora-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-flash-latest

databases:
  - name: velora-db
    plan: free
